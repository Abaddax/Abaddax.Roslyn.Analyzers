name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:

jobs:
  build:
    name: Build and test
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build and test
        uses: Abaddax/workflows/dotnet/actions/build-and-test@master
