name: Publish

on:
  push:
    branches: [ "master" ]
    paths:
      - "**/*.props"

jobs:
  check_version:
    name: Check version change
    runs-on: 'ubuntu-latest'
    steps:
      - uses: Abaddax/workflows/dotnet/actions/check-version.yml@master
        with:
          CSPROJ_PATH: Directory.Build.props
      
  ci:    
    needs: [check_version]
    if: needs.check_version.outputs.version_changed == 'true'
    uses: ./.github/workflows/ci.yml
  
  publish:  
    needs: [check_version, ci]
    if: needs.check_version.outputs.version_changed == 'true'
    uses: ./.github/workflows/publish.nuget.yml
    permissions:
      contents: write
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
