name: Publish NuGet-Package

on:
  workflow_call:
    secrets:
      NUGET_USER:
        description: 'NuGet.org user'
        required: true
  workflow_dispatch:

jobs:
  publish_analyzer_nuget:
    name: Publish Analyzer NuGet-Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Authenticate with NuGet Trusted Publishing
        id: trusted_publishing
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish Analyzers
        uses: Abaddax/workflows/dotnet/actions/publish-nuget@master
        with:
          CSPROJ_PATH: Abaddax.Roslyn.Analyzers.Package/Abaddax.Roslyn.Analyzers.Package.csproj
          NUGET_API_KEY: ${{ steps.trusted_publishing.outputs.NUGET_API_KEY }}
  publish_attributes_nuget:
    name: Publish Attributes NuGet-Package
    needs: [publish_analyzer_nuget]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Authenticate with NuGet Trusted Publishing
        id: trusted_publishing
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish Attributes
        uses: Abaddax/workflows/dotnet/actions/publish-nuget@master
        with:
          CSPROJ_PATH: Abaddax.Roslyn.Analyzers.Attributes/Abaddax.Roslyn.Analyzers.Attributes.csproj
          CREATE_TAG: false
          NUGET_API_KEY: ${{ steps.trusted_publishing.outputs.NUGET_API_KEY }}
  publish_framework_nuget:
    name: Publish Framework NuGet-Package
    needs: [publish_analyzer_nuget]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Authenticate with NuGet Trusted Publishing
        id: trusted_publishing
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish Framework
        uses: Abaddax/workflows/dotnet/actions/publish-nuget@master
        with:
          CSPROJ_PATH: Abaddax.Roslyn.Analyzers.Framework/Abaddax.Roslyn.Analyzers.Framework.csproj
          CREATE_TAG: false
          NUGET_API_KEY: ${{ steps.trusted_publishing.outputs.NUGET_API_KEY }}
