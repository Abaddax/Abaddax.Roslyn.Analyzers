name: Publish NuGet-Package

on:
  workflow_call:
    permissions:
      id-token: write
  workflow_dispatch:

jobs:
  publish_nuget:
    name: Publish NuGet-Package
    runs-on: ubuntu-latest 
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      # Abaddax.Roslyn.Analyzers
      - name: Authenticate with NuGet Trusted Publishing
        id: trusted_publishing_analyzer
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish Abaddax.Roslyn.Analyzers
        uses: Abaddax/workflows/dotnet/actions/publish-nuget@master
        with:
          CSPROJ_PATH: Abaddax.Roslyn.Analyzers.Package/Abaddax.Roslyn.Analyzers.Package.csproj
          NUGET_API_KEY: ${{ steps.trusted_publishing_analyzer.outputs.NUGET_API_KEY }}
      # Abaddax.Roslyn.Analyzers.Attributes
      - name: Authenticate with NuGet Trusted Publishing
        id: trusted_publishing_attributes
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish Abaddax.Roslyn.Analyzers.Attributes
        uses: Abaddax/workflows/dotnet/actions/publish-nuget@master
        with:
          CSPROJ_PATH: Abaddax.Roslyn.Analyzers.Attributes/Abaddax.Roslyn.Analyzers.Attributes.csproj
          CREATE_TAG: false
          NUGET_API_KEY: ${{ steps.trusted_publishing_attributes.outputs.NUGET_API_KEY }}
      # Abaddax.Roslyn.Analyzers.Framework
      - name: Authenticate with NuGet Trusted Publishing
        id: trusted_publishing_framework
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish Abaddax.Roslyn.Analyzers.Framework
        uses: Abaddax/workflows/dotnet/actions/publish-nuget@master
        with:
          CSPROJ_PATH: Abaddax.Roslyn.Analyzers.Framework/Abaddax.Roslyn.Analyzers.Framework.csproj
          CREATE_TAG: false
          NUGET_API_KEY: ${{ steps.trusted_publishing_framework.outputs.NUGET_API_KEY }}

      
